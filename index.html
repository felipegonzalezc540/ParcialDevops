<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 40px;
        text-align: center;
    }

    h1 {
        color: #333;
        margin-bottom: 25px;
    }

    input {
        width: 300px;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
    }

    button {
        padding: 12px 20px;
        margin-left: 8px;
        background-color: #333;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #555;
    }

    ul {
        width: 400px;
        margin: 30px auto;
        padding: 0;
        list-style: none;
    }

    li {
        background-color: white;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 5px;
        text-align: left;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
</style>
</head>

<body>

    <h1>Mi lista de tareas</h1>

    <input type="text" placeholder="Escribe una tarea">

    <button>Agregar tarea</button>

    <ul>
        <li>Estudiar DevOps</li>
        <li>Hacer el parcial</li>
    </ul>

</body>
</html>
